[project]
name = "trader-ai-system"
version = "0.1.0.dev"
description = "Fully autonomous multi-agent trading system using LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.2.15",
    "langchain-anthropic>=1.4.0",
    "langchain-openai>=1.1.12",
    "langgraph>=1.1.6",
    "metatrader5>=5.0.5735",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "rich>=14.3.3",
    "requests>=2.33.1",
    "yfinance>=1.2.1",
    "pandas>=3.0.2",
    "tradingview-ta>=3.3.0",
    "apscheduler>=3.11.2",
    "python-dotenv>=1.2.2",
    "loguru>=0.7.3",
]
[project.scripts]
trade-bot = "auto_trader.main:main"

[dependency-groups]
dev = ["pytest>=9.0.3", "ruff>=0.15.9"]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
fixable = ["ALL"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
